general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = ""
    after_sleep_cmd = ""
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit  = false
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'h1.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'h1.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
